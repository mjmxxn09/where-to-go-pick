name: where_to_go_pick
description: "어디갈지 Pick! — 픽클 친구들과 여행지를 고르고, 다녀온 곳을 지도와 여행 노트로 남기는 앱"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/korea-map.json
    - assets/stickers/

  # 글꼴(SIL OFL)
  # - 감자꽃(Gamja Flower): 여행 노트 손글씨. 영문·기호 + 한글 완성형 11,172자만 남긴 파일(약 6MB).
  #   라이선스: assets/fonts/OFL-GamjaFlower.txt
  # - Jua(제목·지도 라벨): 아직 파일 없음 → 시스템 글꼴로 대체. 넣을 때 아래 주석을 푼다.
  fonts:
    - family: GamjaFlower
      fonts:
        - asset: assets/fonts/GamjaFlower-Regular.ttf
  #   - family: Jua
  #     fonts:
  #       - asset: assets/fonts/Jua-Regular.ttf
