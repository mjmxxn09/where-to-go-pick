name: where_to_go_pick
description: "어디갈지 Pick! — 픽클 친구들과 여행지를 고르고, 다녀온 곳을 지도와 여행 노트로 남기는 앱"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # 날짜·시각 고르기, 기본 버튼 글자를 한국어로
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  # 여행 카드 이미지: 사진 갤러리 저장(Android·iOS), 공유 시트, 웹 다운로드
  gal: ^2.3.0
  share_plus: ^12.0.0
  # 카카오맵 장소 상세 열기
  url_launcher: ^6.3.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/korea-map.json
    - assets/stickers/
    - assets/characters/splash/

  # 글꼴(SIL OFL)
  # - 감자꽃(Gamja Flower): 여행 노트 손글씨. 영문·기호 + 한글 완성형 11,172자만 남긴 파일(약 6MB).
  #   라이선스: assets/fonts/OFL-GamjaFlower.txt
  # - 블랙한산스(Black Han Sans): 앱 이름 "어디갈지 PICK!". 라이선스: assets/fonts/OFL-BlackHanSans.txt
  # - Jua(제목·지도 라벨): 아직 파일 없음 → 시스템 글꼴로 대체. 넣을 때 아래 주석을 푼다.
  fonts:
    - family: GamjaFlower
      fonts:
        - asset: assets/fonts/GamjaFlower-Regular.ttf
    - family: BlackHanSans
      fonts:
        - asset: assets/fonts/BlackHanSans-Regular.ttf
  #   - family: Jua
  #     fonts:
  #       - asset: assets/fonts/Jua-Regular.ttf
