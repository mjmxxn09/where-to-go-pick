name: where_to_go_pick
description: "어디갈지 Pick! — 픽클 친구들과 여행지를 고르고, 다녀온 곳을 지도와 여행 노트로 남기는 앱"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/korea-map.json

  # 글꼴: Jua(제목·지도 라벨), Nanum Pen Script(여행 노트 손글씨) — 둘 다 SIL OFL.
  # assets/fonts/ 에 ttf를 넣고 아래 주석을 풀면 적용된다. 없으면 시스템 글꼴로 자동 대체된다.
  # fonts:
  #   - family: Jua
  #     fonts:
  #       - asset: assets/fonts/Jua-Regular.ttf
  #   - family: NanumPenScript
  #     fonts:
  #       - asset: assets/fonts/NanumPenScript-Regular.ttf
